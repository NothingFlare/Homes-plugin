  storage-error: "[Homes] ¡Error crítico al inicializar el almacenamiento {type}!"
  storage-close-error: "[Homes] Error al cerrar el almacenamiento anterior:"
  storage-reload-error: "[Homes] ¡Error al conectar con el nuevo almacenamiento en la recarga!"
  homes-loaded: "[Homes] {count} homes cargados desde la base de datos."
  homes-load-error: "[Homes] ¡Error al cargar homes desde la base de datos!"
  migration-found: "[Homes] Archivo homes.yml heredado detectado. Realizando migración automática a la base de datos..."
  migration-success: "[Homes] ¡Migración completada con éxito! {count} homes transferidos."
  migration-error: "[Homes] Error al guardar el home migrado {name}:"
  save-async-error: "[Homes] Error al guardar asíncronamente el home {name} del jugador {uuid}:"
  plugin-disabled: "[Homes] ¡Homes ha sido deshabilitado!"
  init-failed: "[Homes] ¡Error al inicializar el almacenamiento! Desactivando plugin."
  updates-checking: "[Homes] Buscando actualizaciones..."
  updates-latest: "[Homes] Estás ejecutando la última versión (v{version})"
  updates-available: "[Homes] Nueva versión disponible: v{remote} (Actual: v{current})"
