# ==============================================================================
# Хранилище данных (SQLite / MySQL)
# ==============================================================================
storage:
  # Тип используемого хранилища: "sqlite" или "mysql"
  type: "sqlite"

  # Настройки SQLite (локальный файл базы данных в папке плагина)
  sqlite:
    file: "homes.db"

  # Настройки MySQL
  mysql:
    host: "localhost"
    port: 3306
    database: "homes"
    username: "root"
    password: ""
    table-prefix: "homes_"
    ssl: false
    pool-size: 10

# ==============================================================================
# Шифрование данных хомов (Защита от администраторов)
# ==============================================================================
encryption:
  # Включить шифрование координат и информации о хомах (AES-256-GCM).
  # При включении администратор сервера или БД, открыв базу данных (phpMyAdmin,
  # HeidiSQL, SQLite viewer), увидит только зашифрованную строку (ENC:v1:...),
  # и не сможет узнать координаты X/Y/Z, название мира или угол поворота игрока.
  enabled: true

  # Секретный мастер-ключ шифрования.
  # Если оставить пустым (""), плагин автоматически сгенерирует надежный 256-битный ключ
  # в скрытый файл .encryption_key внутри папки плагина.
  # ВНИМАНИЕ: не теряйте этот ключ, иначе зашифрованные хомы невозможно будет прочитать!
  secret-key: ""

# ==============================================================================
# Проверка обновлений (Modrinth / GitHub)
# ==============================================================================
# Автоматическая проверка новой версии плагина при запуске
check-updates: true

# ==============================================================================
# Основные параметры
# ==============================================================================
# Максимум хомов на игрока. Проверяется в /sethome.
home-limit: 10

# Задержка перед телепортацией в секундах. 0 — телепортация сразу.
teleport-timeout: 5
