  not-found: "&cХом {name} не найден."
  no-permission: "&cУ вас нет прав на удаление хомов."

home:
  usage: "&eИспользование: /home <название>"
  usage-admin: "&eИспользование: /home <название> | /home reload"
  not-found: "&cХом {name} не найден."
  world-not-loaded: "&cМир хома {name} ({world}) не загружен."
  only-players: "&cТолько для игроков. Консоль может использовать: /home clear <ник|all> или /home reload"

homes:
  usage: "&eИспользование: /homes"
  only-players: "&cКоманда /homes (GUI) доступна только игрокам."
  console-usage: "&eИспользование для консоли: /homes add <homes.yml|sqlite|legacy> to MySQL <логин:пароль>"

clear:
  console-only: "&cКоманду /home clear можно выполнять только из консоли!"
  usage: "&eИспользование: /home clear <ник|all>"
  all-success: "&aВсе хомы всех игроков успешно удалены (всего удалено: {count})."
  player-success: "&aВсе хомы игрока {player} успешно удалены (удалено: {count})."
  player-not-found: "&cУ игрока {player} не найдено ни одного хома."

reload:
  success: "&aHomes config, storage and languages reloaded successfully!"
  error: "&cОшибка при перезагрузке хранилища данных! Проверьте консоль сервера."

export:
  console-only: "&cКоманду /homes add можно выполнять только из консоли!"
  usage: "&eИспользование: /homes add <homes.yml|sqlite|legacy> to MySQL <логин:пароль>"
  example-1: "&7Пример: /homes add homes.yml to MySQL root:secret123"
  example-2: "&7Пример: /homes add sqlite to MySQL root:secret123"
  unsupported-target: "&cНеподдерживаемая целевая база: {target}. Поддерживается: MySQL"
  start: "&e[Homes] Начинается экспорт хомов из {source} в MySQL..."
  empty: "&c[Homes] В источнике '{source}' не найдено ни одного хома для экспорта!"
  connecting: "&e[Homes] Найдено хомов для экспорта: {count}. Подключение к MySQL..."
  writing: "&e[Homes] Подключение к MySQL успешно установлено. Идёт запись в базу данных..."
  success-header: "&a===================================================="
  success-title: "&a[Homes] Экспорт успешно завершен!"
  success-stats: "&aПеренесено хомов: {count} (игроков: {players})"
  success-target: "&aЦелевая база: MySQL {host}:{port}/{database} (таблица: {table})"
  success-footer: "&a===================================================="
  error: "&c[Homes] Ошибка при экспорте хомов: {error}"

