  no-permission: "&cVocê não tem permissão para executar este comando."

sethome:
  usage: "&eUso: /sethome <nome>"
  name-reserved: "&cO nome {name} é reservado para comandos do sistema."
  invalid-name: "&cO nome da home só pode conter letras, números, hífens e sublinhados (máx. 32 caracteres). Pontos não são permitidos."
  limit-reached: "&cLimite de homes atingido ({count}/{limit}). Remova uma home com /delhome <nome>."
  overwritten: "&aHome {name} sobrescrita."
  created: "&aHome {name} definida com sucesso."

delhome:
  usage: "&eUso: /delhome <nome>"
  deleted: "&aHome {name} excluída."
  not-found: "&cHome {name} não encontrada."
  no-permission: "&cVocê não tem permissão para excluir homes."

home:
  usage: "&eUso: /home <nome>"
  usage-admin: "&eUso: /home <nome> | /home reload"
  not-found: "&cHome {name} não encontrada."
  world-not-loaded: "&cO mundo da home {name} ({world}) não está carregado."
  only-players: "&cApenas jogadores podem se teletransportar. Console: /home clear <jogador|all> ou /home reload"

homes:
  usage: "&eUso: /homes"
  only-players: "&cO comando /homes (GUI) só está disponível para jogadores."
  console-usage: "&eUso no console: /homes add <homes.yml|sqlite|legacy> to MySQL <usuário:senha>"

clear:
  console-only: "&cO comando /home clear só pode ser executado pelo console do servidor!"
  usage: "&eUso: /home clear <jogador|all>"
  all-success: "&aTodas as homes de todos os jogadores foram excluídas (total: {count})."
  player-success: "&aTodas as homes do jogador {player} foram excluídas (total: {count})."
  player-not-found: "&cNenhuma home encontrada para o jogador {player}."

reload:
  success: "&aConfigurações, banco de dados e idiomas do Homes recarregados com sucesso!"
  error: "&cErro ao recarregar o armazenamento! Verifique o console do servidor."

export:
  console-only: "&cO comando /homes add só pode ser executado pelo console do servidor!"
  usage: "&eUso: /homes add <homes.yml|sqlite|legacy> to MySQL <usuário:senha>"
  example-1: "&7Exemplo: /homes add homes.yml to MySQL root:senha123"
  example-2: "&7Exemplo: /homes add sqlite to MySQL root:senha123"
  unsupported-target: "&cBanco de dados de destino não suportado: {target}. Suportado: MySQL"
  start: "&e[Homes] Iniciando exportação de homes de {source} para MySQL..."
  empty: "&c[Homes] Nenhuma home encontrada na fonte '{source}' para exportar!"
  connecting: "&e[Homes] Encontradas {count} homes. Conectando ao MySQL..."
  writing: "&e[Homes] Conexão com o MySQL estabelecida. Gravando dados..."
  success-header: "&a===================================================="
  success-title: "&a[Homes] Exportação concluída com sucesso!"
  success-stats: "&aHomes migradas: {count} (jogadores: {players})"
  success-target: "&aBanco de destino: MySQL {host}:{port}/{database} (tabela: {table})"
  success-footer: "&a===================================================="
  error: "&c[Homes] Erro ao exportar homes: {error}"

teleport:
  warmup: "&eFique parado! Teleporte em {seconds} seg."
  cancelled-moved: "&cTeleporte cancelado: você se moveu."
