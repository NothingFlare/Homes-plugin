command:
  only-players: "&cТолько для игроков."
  no-permission: "&cУ вас нет прав."

sethome:
  usage: "&eИспользование: /sethome <название>"
  name-reserved: "&cНазвание {name} зарезервировано для системных команд."
  invalid-name: "&cНазвание хома может содержать только буквы, цифры, дефис и подчеркивание (макс. 32 символа). Точки запрещены."
  limit-reached: "&cЛимит хомов исчерпан ({count}/{limit}). Удали ненужный через /delhome <название>."
  overwritten: "&aХом {name} перезаписан."
  created: "&aХом {name} установлен."

delhome:
  usage: "&eИспользование: /delhome <название>"
