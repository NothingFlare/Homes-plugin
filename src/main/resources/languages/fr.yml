command:
  only-players: "&cSeuls les joueurs peuvent exécuter cette commande."
  no-permission: "&cVous n'avez pas la permission d'exécuter cette commande."

sethome:
  usage: "&eUtilisation: /sethome <nom>"
  name-reserved: "&cLe nom {name} est réservé aux commandes du système."
  invalid-name: "&cLe nom du home ne peut contenir que des lettres, chiffres, tirets et underscores (max 32 car.). Les points sont interdits."
  limit-reached: "&cLimite de homes atteinte ({count}/{limit}). Supprimez-en un avec /delhome <nom>."
  overwritten: "&aLe home {name} a été écrasé."
  created: "&aLe home {name} a été défini."

delhome:
  usage: "&eUtilisation: /delhome <nom>"
  deleted: "&aLe home {name} a été supprimé."
  not-found: "&cLe home {name} est introuvable."
  no-permission: "&cVous n'avez pas la permission de supprimer des homes."

home:
  usage: "&eUtilisation: /home <nom>"
  usage-admin: "&eUtilisation: /home <nom> | /home reload"
  not-found: "&cLe home {name} est introuvable."
  world-not-loaded: "&cLe monde du home {name} ({world}) n'est pas chargé."
  only-players: "&cSeuls les joueurs peuvent se téléporter. Console: /home clear <joueur|all> ou /home reload"

homes:
  usage: "&eUtilisation: /homes"
  only-players: "&cLa commande /homes (GUI) est réservée aux joueurs."
  console-usage: "&eUtilisation console: /homes add <homes.yml|sqlite|legacy> to MySQL <utilisateur:motdepasse>"

clear:
  console-only: "&cLa commande /home clear ne peut être exécutée que depuis la console !"
  usage: "&eUtilisation: /home clear <joueur|all>"
  all-success: "&aTous les homes de tous les joueurs ont été supprimés (total: {count})."
  player-success: "&aTous les homes du joueur {player} ont été supprimés (total: {count})."
  player-not-found: "&cAucun home trouvé pour le joueur {player}."

reload:
  success: "&aConfiguration, base de données et langues de Homes rechargées avec succès !"
  error: "&cErreur lors du rechargement du moteur de stockage ! Vérifiez la console."

export:
  console-only: "&cLa commande /homes add ne peut être exécutée que depuis la console !"
  usage: "&eUtilisation: /homes add <homes.yml|sqlite|legacy> to MySQL <utilisateur:motdepasse>"
