  example-2: "&7Exemple: /homes add sqlite to MySQL root:secret123"
  unsupported-target: "&cBase de données cible non prise en charge: {target}. Supporté: MySQL"
  start: "&e[Homes] Début de l'exportation des homes depuis {source} vers MySQL..."
  empty: "&c[Homes] Aucun home à exporter trouvé dans la source '{source}' !"
  connecting: "&e[Homes] {count} homes trouvés. Connexion à MySQL en cours..."
  writing: "&e[Homes] Connexion à MySQL établie. Écriture des données en cours..."
  success-header: "&a===================================================="
  success-title: "&a[Homes] Exportation terminée avec succès !"
  success-stats: "&aHomes migrés: {count} (joueurs: {players})"
  success-target: "&aBase cible: MySQL {host}:{port}/{database} (table: {table})"
  success-footer: "&a===================================================="
  error: "&c[Homes] Erreur lors de l'exportation des homes: {error}"

teleport:
  warmup: "&eNe bougez pas ! Téléportation dans {seconds} sec."
  cancelled-moved: "&cTéléportation annulée: vous avez bougé."
