name: HomesPlugin
version: '1.2.1'
main: ru.homes.plugin.HomesPlugin
api-version: '1.20'

commands:
  sethome:
    description: Поставить хом
    usage: /sethome <название>
    permission: homes.sethome
  delhome:
    description: Удалить хом
    usage: /delhome <название>
    permission: homes.delhome
  home:
    description: Телепортироваться к хому
    usage: /home <название>
    permission: homes.home
  homes:
    description: Открыть GUI со списком хомов
    usage: /homes
    permission: homes.homes

permissions:
  homes.sethome:
    description: Позволяет ставить хомы
    default: true
  homes.delhome:
    description: Позволяет удалять хомы
    default: true
  homes.home:
    description: Позволяет телепортироваться к хомам
    default: true
  homes.homes:
    description: Позволяет открывать GUI со списком хомов
    default: true
  homes.bypass:
    description: Снимает лимит на количество хомов (home-limit)
    default: op
